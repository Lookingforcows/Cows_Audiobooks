<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Looking for cows Audio</title>
 
  <meta name="description" content="Audiobooks and poetry read by a real person — full audiobooks, chapters, and original poetry.">
  <meta property="og:title" content="Looking for cows Audio">
  <meta property="og:description" content="Hand-read audiobooks & poetry. Listen free.">
  <meta property="og:image" content="https://lookingforcows.com/assets/IMG_0716.jpg">

  <link rel="icon" href="https://lookingforcows.com/favicon/favicon.ico" type="image/x-icon" />

  <style>
    /* (Keeping your original beautiful styles — only adding minimal changes) */
    @font-face {
      font-family: 'Open Dyslexic';
      src: url('/assets/fonts/OpenDyslexic-Regular.woff2') format('woff2'),
           url('/assets/fonts/OpenDyslexic-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    body {
      margin: 0; padding: 0;
      font-family: 'Open Dyslexic', sans-serif;
      color: white;
      display: flex; flex-direction: column;
      min-height: 100vh; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-image: url('/assets/IMG_0716.jpg');
      background-size: cover; background-position: center;
      z-index: -1; filter: brightness(0.65);
    }
    main.container {
      max-width: 800px; width: 100%;
      margin: 10vh auto 20px auto;
      padding: 30px 20px; background-color: rgba(0,0,0,0.85);
      border-radius: 12px; text-align: center;
    }
    .episode-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .episode {
      background: rgba(0,0,0,0.75); border-radius: 12px;
      padding: 20px; display: flex; flex-direction: column;
    }
    .episode img { width: 100%; max-width: 200px; border-radius: 8px; }
    .episode audio { width: 100%; margin: 12px 0; }
    .download-btn {
      color: #00aaff; text-decoration: none; padding: 10px 18px;
      border: 1px solid #00aaff; border-radius: 6px; margin-top: 8px;
    }
    .download-btn:hover { background: #00aaff; color: white; }
    /* ... rest of your styles (filters, search, thumbnails, spinner, etc.) ... */
    .filter-buttons button.active { background-color: #00aaff; }
    #search-input { width: 100%; max-width: 420px; padding: 14px 18px; margin: 20px auto; background: rgba(255,255,255,0.12); border: 2px solid #555; border-radius: 50px; color: white; }
  </style>
</head>
<body>
  <!-- Your thumbnail buttons stay the same -->
  <div class="thumbnail-container"> ... </div>

  <main class="container">
    <header>
      <h1>Audiobooks for people, read by a person.</h1>
      <p>Listen below. Enjoy!</p>
    </header>

    <input type="text" id="search-input" placeholder="Search titles or descriptions...">

    <nav class="filter-buttons">
      <button id="allBtn" onclick="setFilter('all')">All</button>
      <button id="audiobookBtn" class="active" onclick="setFilter('audiobook')">Full Audiobooks</button>
      <button id="poetryBtn" onclick="setFilter('poetry')">Poetry</button>
    </nav>

    <div class="episode-list" id="episode-list">
      <div class="spinner"></div>
    </div>
  </main>

  <script>
    let allEpisodes = [];
    let currentFilter = 'audiobook';
    let searchQuery = '';

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-buttons button').forEach(b => b.classList.remove('active'));
      document.getElementById(filter + 'Btn').classList.add('active');
      renderEpisodes();
    }

    function getDirectUrl(anchorUrl) {
      if (!anchorUrl) return '';
      try {
        // New robust parser for Anchor URLs
        if (anchorUrl.includes('/podcast/play/')) {
          const parts = anchorUrl.split('/podcast/play/')[1];
          const encoded = parts.split('/https%3A%2F%2F')[1] || parts;
          return 'https://' + decodeURIComponent(encoded);
        }
      } catch(e) { console.error("URL decode failed", e); }
      return anchorUrl;
    }

    function renderEpisodes() {
      const container = document.getElementById('episode-list');
      container.innerHTML = '';

      const filtered = allEpisodes.filter(ep => {
        const catMatch = currentFilter === 'all' ||
                        (currentFilter === 'audiobook' && ep.isAudiobook) ||
                        (currentFilter === 'poetry' && ep.isPoetry);
        const searchMatch = !searchQuery || 
                           ep.title.toLowerCase().includes(searchQuery) ||
                           ep.description.toLowerCase().includes(searchQuery);
        return catMatch && searchMatch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="padding:40px;">No episodes found.</p>`;
        return;
      }

      filtered.forEach(ep => {
        const direct = getDirectUrl(ep.link);
        const isM4a = direct.toLowerCase().endsWith('.m4a');

        const div = document.createElement('article');
        div.className = 'episode';
        div.innerHTML = `
          <img src="${ep.coverImage}" loading="lazy" alt="${ep.title}">
          <h3>${ep.title}</h3>
          <p class="meta">${ep.date} ${ep.duration ? '• ' + ep.duration : ''}</p>
          <p class="desc">${ep.description}</p>
          
          <audio controls preload="metadata">
            <source src="${direct}" type="${isM4a ? 'audio/mp4' : 'audio/mpeg'}">
          </audio>
          
          <a href="${direct}" class="download-btn" target="_blank" download>⬇ Download</a>
        `;
        container.appendChild(div);
      });
    }

    async function fetchEpisodes() {
      try {
        const res = await fetch('https://anchor.fm/s/e586064c/podcast/rss');
        const xml = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'application/xml');

        allEpisodes = Array.from(doc.getElementsByTagName('item')).map(item => {
          const title = item.getElementsByTagName('title')[0]?.textContent || '';
          const rawDesc = item.getElementsByTagName('description')[0]?.textContent || '';
          const description = new DOMParser().parseFromString(rawDesc, 'text/html').body.textContent || '';
          const enclosure = item.getElementsByTagName('enclosure')[0];
          const link = enclosure ? enclosure.getAttribute('url') : '';
          const cover = item.getElementsByTagName('itunes:image')[0]?.getAttribute('href') || '/assets/default-cover.jpg';
          const pubDate = item.getElementsByTagName('pubDate')[0]?.textContent || '';
          const duration = item.getElementsByTagName('itunes:duration')[0]?.textContent || '';

          return {
            title,
            description: description.trim(),
            link,
            coverImage: cover,
            date: pubDate ? new Date(pubDate).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '',
            duration,
            isAudiobook: title.toLowerCase().includes('audiobook') || description.toLowerCase().includes('audiobook'),
            isPoetry: title.toLowerCase().includes('poetry') || description.toLowerCase().includes('poetry')
          };
        }).sort((a,b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0));  // Note: pubDate added if needed

        renderEpisodes();
      } catch(e) {
        console.error(e);
        document.getElementById('episode-list').innerHTML = `<p style="color:#ff6666; padding:40px;">Failed to load episodes. Try refreshing.</p>`;
      }
    }

    window.onload = () => {
      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderEpisodes();
      });
      fetchEpisodes();
    };
  </script>
</body>
</html>
